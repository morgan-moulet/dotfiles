# Starship Configuration — Homelab & Dev Standard
# Schema: https://starship.rs/config-schema.json

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Structure du prompt :
# Ligne 1 : Machine + Répertoire + Git + Docker + Runtimes + Temps d'exécution
# Ligne 2 : Symbole d'invite de commande (❯)
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# Prompt droit : Statut d'erreur (si commande échouée) et jobs d'arrière-plan
right_format = """$jobs$status"""

[os]
disabled = false
style = "bold blue"
symbols = { Debian = " ", Ubuntu = " ", Arch = " ", Linux = " " }

[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "bold cyan"
format = "[$hostname]($style) "

[directory]
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
style = "bold lavender"
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = " "
stashed = "📦 "
modified = " "
staged = "󰄬 "
renamed = "󰑕 "
deleted = "󰮈 "

[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "󱎫 [$duration]($style) "

[jobs]
symbol = "✦ "
style = "bold blue"
format = "[$symbol$number]($style) "

[status]
disabled = false
style = "bold red"
symbol = "✘ "
format = "[$symbol$status]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"
