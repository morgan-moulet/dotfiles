# Starship Configuration — Plain / Mobile / Universal (No Nerd Fonts required)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

[hostname]
ssh_only = false
style = "bold cyan"
format = '[$hostname]($style) '

[directory]
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = true
style = "bold blue"
format = '[$path]($style) '

[git_branch]
symbol = "git:"
style = "bold magenta"
format = '[\($symbol$branch\)]($style) '

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
ahead = "+${count}"
behind = "-${count}"
diverged = "+${ahead_count}-${behind_count}"
modified = "*"
staged = "+"
untracked = "?"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = '[$duration]($style) '

[character]
success_symbol = "[>](bold green) "
error_symbol = "[>](bold red) "
