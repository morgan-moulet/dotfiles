# ==============================================================================
# ~/.config/btop/btop.conf — Modern Resource Monitor Configuration
# Managed by Chezmoi (morgan-moulet/dotfiles)
# ==============================================================================

color_theme = "Default"
theme_background = False
truecolor = True
force_tty = False

# Layout and Display
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
vim_keys = True
rounded_corners = True
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

# Refresh rate in ms (1000ms = 1s update)
update_ms = 1000

# Processes box
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = True
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True
proc_info_kernel = False

# CPU box
cpu_bottom = False
cpu_custom_subtitles = True
cpu_core_map = ""
check_temp = True
cpu_sensor = "Auto"
show_coretemp = True
cpu_usage_graph = True
temp_scale = "celsius"
show_uptime = True

# Memory box
mem_graphs = True
mem_below_net = False
zfs_arc_cached = True
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = True
zfs_hide_datasets = False
disk_free_priv = False

# Filter out Docker mount noise and boot partitions
disks_filter = "exclude=/boot /var/lib/docker/overlay2 /run/user"

# Network box
net_download = 100
net_upload = 100
net_auto = True
net_sync = True
net_iface = ""
base_10_sizes = False
show_battery = False
log_level = "WARNING"
