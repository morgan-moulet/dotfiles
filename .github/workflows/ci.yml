name: Zero-Noise PR Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: morgan-moulet/ai-skills/.github/workflows/reusable-pr-review.yml@main
    secrets: inherit
