# ==============================================================================
# ~/.tmux.conf — AI Agent & Homelab Optimized Tmux Configuration
# Managed by Chezmoi (morgan-moulet/dotfiles)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Prefix & Keyboard Ergonomics
# ------------------------------------------------------------------------------
# Dual prefix: Both Ctrl-a and Ctrl-b work as prefix
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix -2

# Zero delay for Escape key (crucial for Vim modes and interactive AI prompts)
set -s escape-time 0
set -g repeat-time 300
set -g focus-events on

# Reload configuration easily
bind r source-file ~/.tmux.conf \; display-message " ✓ tmux.conf reloaded!"

# ------------------------------------------------------------------------------
# 2. Terminal Capabilities & Colors (24-bit TrueColor & Unicode)
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{1}%d::%p2%{1}%d::%p3%{1}%d%dm' # Colored underlines

# ------------------------------------------------------------------------------
# 3. AI Agent Scrollback & Buffer Capacity
# ------------------------------------------------------------------------------
# Massive 100,000-line history buffer for long diffs, stack traces & agent logs
set -g history-limit 100000

# Natural 1-based indexing for windows and panes (matches 1-9 keyboard layout)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# 4. Mouse Support & Seamless Copy-Paste (OSC-52 Clipboard)
# ------------------------------------------------------------------------------
# Enable mouse for instant pane switching, resizing, and scrollback review
set -g mouse on

# Vi navigation mode in scrollback / copy mode
setw -g mode-keys vi

# Universal OSC 52 clipboard (works over SSH, JetBrains Gateway, JuiceSSH without X11)
set -s set-clipboard on

# Vim-like selection and copying bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ------------------------------------------------------------------------------
# 5. Pane & Window Management
# ------------------------------------------------------------------------------
# Split panes preserving the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Fast pane navigation with Alt + Arrows (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Fast pane navigation with Alt + hjkl (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing with Prefix + H, J, K, L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize / Zoom active pane toggle
bind z resize-pane -Z

# Quick kill pane without confirmation prompt
bind x kill-pane

# ------------------------------------------------------------------------------
# 6. AI Multi-Agent Helpers
# ------------------------------------------------------------------------------
# Toggle Pane Synchronization (broadcast inputs to ALL panes at once)
# Ideal for running the same command or prompt across multiple agents/nodes
bind S setw synchronize-panes \; display-message "Synchronize Panes: #{?pane_synchronized,ON,OFF}"

# Pipe pane output to file (continuous session logging for agent auditing)
bind P pipe-pane -o "mkdir -p $HOME/.tmux/logs; cat >> $HOME/.tmux/logs/%Y%m%d-%H%M%S-#S-#W-#P.log" \; display-message "Logging #{?pane_pipe,ON,OFF} -> ~/.tmux/logs/"

# ------------------------------------------------------------------------------
# 7. Modern Status Bar & Visual Indicators (Catppuccin / TokyoNight Inspired)
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-interval 3

# Bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Active pane border (clearly highlights which agent pane is currently active)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa,bold"

# Message styling
set -g message-style "bg=#89b4fa,fg=#11111b,bold"

# Left status: session name with icon
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] 󰖯 #S #[bg=#1e1e2e,fg=#89b4fa] "

# Right status: active directory, date, time & host
set -g status-right-length 100
set -g status-right "#[fg=#a6adc8]󰉋 #{b:pane_current_path} #[fg=#585b70]│ #[fg=#a6e3a1]󱑍 %H:%M #[fg=#585b70]│ #[fg=#f38ba8] #H #[bg=#1e1e2e] "

# Window status tabs
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I: #W #{?window_zoomed_flag,󰊓 ,}#{?pane_synchronized,󰓦 ,}#[bg=#1e1e2e]"
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I: #W #{?window_zoomed_flag,󰊓 ,}#{?pane_synchronized,󰓦 ,}#[bg=#1e1e2e]"
